<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TETR.IX - Zen Mode</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            background: #0f0e15;
            color: white;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        
        .header {
            width: 100%;
            text-align: center;
            padding: 30px 0 10px 0;
            position: relative;
        }
        
        .game-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-top: 0;
        }
        
        .left-panel {
            display: flex;
            flex-direction: column;
            width: 150px;
        }
        
        .game-board {
            position: relative;
            width: 300px;
            height: 600px;
            border: 2px solid #4e6dc9; /* Zen blue */
            box-shadow: 0 0 15px rgba(78, 109, 201, 0.3);
        }
        
        .right-panel {
            display: flex;
            flex-direction: column;
            width: 150px;
        }
        
        .panel-section {
            background: #1a1829;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            border-left: 4px solid #4e6dc9; /* Zen blue */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        
        .panel-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: #d1d1ff;
            text-align: center;
        }
        
        .panel-value {
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            color: #ffffff;
        }
        
        .hold-container, .next-container {
            width: 120px;
            height: 120px;
            margin: 0 auto;
            border: 2px solid #2d2b42;
            position: relative;
            overflow: hidden;
            background: rgba(30, 30, 60, 0.3);
            border-radius: 4px;
        }
        
        .next-container {
            height: 360px;
        }
        
        .back-button {
            padding: 10px 20px;
            background: #e63946;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            margin: 0 10px;
            transition: all 0.2s;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            position: absolute;
            left: 20px;
            top: 20px;
        }
        
        .back-button:hover {
            background: #ff4c5b;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        
        .pause-button {
            padding: 10px 20px;
            background: #4ec96d;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            margin: 0 10px;
            transition: all 0.2s;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            position: absolute;
            right: 20px;
            top: 20px;
        }
        
        .pause-button:hover {
            background: #5ed97c;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        
        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
        
        .zen-message {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.9rem;
            color: #a5a3c0;
            font-style: italic;
            text-align: center;
            width: 80%;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>ZEN MODE</h1>
        <button class="back-button" id="back-button">← Back to Modes</button>
        <button class="pause-button" id="pause-button">Pause</button>
    </div>
    
    <div class="game-container">
        <div class="control-guide" style="display:none;"></div>
        <div class="left-panel">
            <div class="panel-section">
                <div class="panel-title">HOLD</div>
                <div class="hold-container">
                    <canvas id="hold-canvas" width="120" height="120"></canvas>
                </div>
            </div>
            
            <div class="panel-section">
                <div class="panel-title">SCORE</div>
                <div class="panel-value" id="score-display">0</div>
            </div>
            
            <div class="panel-section">
                <div class="panel-title">LINES</div>
                <div class="panel-value" id="lines-display">0</div>
            </div>
            
            <div class="panel-section">
                <div class="panel-title">TIME</div>
                <div class="panel-value" id="time-display">0:00</div>
            </div>
        </div>
        
        <div class="game-board">
            <canvas id="grid-canvas" width="300" height="600"></canvas>
            <canvas id="block-canvas" width="300" height="600"></canvas>
            <canvas id="ui-canvas" width="300" height="600"></canvas>
            
            <div class="zen-message">
                Relax and enjoy. There's no game over in Zen Mode.
            </div>
        </div>
        
        <div class="right-panel">
            <div class="panel-section">
                <div class="panel-title">NEXT</div>
                <div class="next-container">
                    <canvas id="next-canvas" width="120" height="360"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script src="zen.js"></script> 
    <script src="sologame.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  const currentUser = JSON.parse(localStorage.getItem('tetrixCurrentUser'));
  if (!currentUser) {
    window.location.href = 'login.html';
  }
});
</script>
</body>
</html>
