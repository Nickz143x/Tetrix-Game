<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TETR.IX - Blitz Mode</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            background: #0f0e15;
            color: white;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        
        .header {
            width: 100%;
            text-align: center;
            padding: 30px 0 10px 0;
            position: relative;
            flex-shrink: 0;
        }
        
        .game-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin: 0;
        }
        
        .left-panel {
            display: flex;
            flex-direction: column;
            width: 150px;
        }
        
        .game-board {
            position: relative;
            width: 300px;
            height: 600px;
            border: 2px solid #4ec96d;
            box-shadow: 0 0 15px rgba(78, 201, 109, 0.3);
        }
        
        .right-panel {
            display: flex;
            flex-direction: column;
            width: 150px;
        }
        
        .panel-section {
            background: #1a1829;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            border-left: 4px solid #4ec96d;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        
        .panel-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: #d1d1ff;
            text-align: center;
        }
        
        .panel-value {
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            color: #ffffff;
        }
        
        .hold-container, .next-container {
            width: 120px;
            height: 120px;
            margin: 0 auto;
            border: 2px solid #2d2b42;
            position: relative;
            overflow: hidden;
            background: rgba(30, 30, 60, 0.3);
            border-radius: 4px;
        }
        
        .next-container {
            height: 360px;
        }
        
        .time-display {
            font-size: 1.8rem;
            color: #ff5555;
            text-align: center;
            margin: 10px 0;
            font-weight: 700;
            text-shadow: 0 0 8px rgba(255, 85, 85, 0.5);
        }
        
        .time-critical {
            animation: pulse 0.5s infinite alternate;
        }
        
        @keyframes pulse {
            from { opacity: 1; }
            to { opacity: 0.7; }
        }
        
        .back-button {
            padding: 10px 20px;
            background: #e63946;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            position: absolute;
            left: 20px;
            top: 20px;
        }
        
        .back-button:hover {
            background: #ff4c5b;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        
        .pause-button {
            padding: 10px 20px;
            background: #4ec96d;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            position: absolute;
            right: 20px;
            top: 20px;
        }
        
        .pause-button:hover {
            background: #5ed97c;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        
        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
        #grid-canvas {
            z-index: 1;
        }
        #block-canvas {
            z-index: 2;
        }
        #ui-canvas {
            z-index: 3;
        }
        
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        
        #game-over h2 {
            font-size: 2.5rem;
            color: #ff5555;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255, 85, 85, 0.7);
        }
        
        #game-over p {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }
        
        #game-over .stats {
            margin-bottom: 30px;
            text-align: center;
        }
        
        #game-over button {
            padding: 12px 25px;
            background: #4ec96d;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
            margin: 5px;
        }
        
        #game-over button:hover {
            background: #5ed97c;
            transform: scale(1.05);
        }
        
        .button-group {
            display: flex;
            gap: 15px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>BLITZ MODE</h1>
        <button class="back-button" id="back-button">← Back to Modes</button>
        <button class="pause-button" id="pause-button">Pause</button>
    </div>
    
    <div class="game-container">
        <div class="left-panel">
            <div class="panel-section">
                <div class="panel-title">HOLD</div>
                <div class="hold-container">
                    <canvas id="hold-canvas" width="120" height="120"></canvas>
                </div>
            </div>
            
            <div class="panel-section">
                <div class="panel-title">SCORE</div>
                <div class="panel-value" id="score-display">0</div>
            </div>
            
            <div class="panel-section">
                <div class="panel-title">TIME</div>
                <div class="time-display" id="time-display">2:00</div>
            </div>
            
            <div class="panel-section">
                <div class="panel-title">LINES</div>
                <div class="panel-value" id="lines-display">0</div>
            </div>
        </div>
        
        <div class="game-board">
            <canvas id="grid-canvas" width="300" height="600"></canvas>
            <canvas id="block-canvas" width="300" height="600"></canvas>
            <canvas id="ui-canvas" width="300" height="600"></canvas>
            
            <div id="game-over">
                <h2>TIME'S UP!</h2>
                <div class="stats">
                    <p>Final Score: <span id="final-score">0</span></p>
                    <p>Lines Cleared: <span id="final-lines">0</span></p>
                </div>
                <div class="button-group">
                    <button id="restart-button">Play Again</button>
                    <button id="mode-select-button">Mode Select</button>
                </div>
            </div>
        </div>
        
        <div class="right-panel">
            <div class="panel-section">
                <div class="panel-title">NEXT</div>
                <div class="next-container">
                    <canvas id="next-canvas" width="120" height="360"></canvas>
                </div>
            </div>
        </div>
    </div>

    <div id="leaderboard-box" style="
        position: fixed;
        top: 100px;
        right: 20px;
        width: 220px;
        max-height: 400px;
        background: #1a1829;
        border-left: 4px solid #4ec96d;
        border-radius: 12px 0 0 12px;
        box-shadow: 0 4px 8px rgba(78, 201, 109, 0.5);
        color: #d1d1ff;
        font-weight: 600;
        font-size: 1rem;
        padding: 15px;
        overflow-y: auto;
        z-index: 1000;
        user-select: none;
    ">
        <div style="font-weight: 700; font-size: 1.2rem; margin-bottom: 10px; text-align: center; color: #a3f3a3; text-shadow: 0 0 6px #4ec96d;">
            Blitz Mode Leaderboard
        </div>
        <ul id="leaderboard-list" style="list-style: none; padding: 0; margin: 0;">
            <li>Loading...</li>
        </ul>
    </div>

    <script src="blitz.js"></script>
    <script>
        function loadLeaderboard() {
            const currentUser = JSON.parse(localStorage.getItem('tetrixCurrentUser')) || {};
            const playerName = currentUser.username || (currentUser.guest ? 'Guest' : 'Player');
            const scores = JSON.parse(localStorage.getItem('tetrixBlitzScores') || '[]');
            const userScores = scores.filter(score => score.name === playerName);
            // Sort descending by score
            userScores.sort((a, b) => b.score - a.score);
            // Take top 5
            const topScores = userScores.slice(0, 5);
            const leaderboardList = document.getElementById('leaderboard-list');
            leaderboardList.innerHTML = '';
            if (topScores.length === 0) {
                leaderboardList.innerHTML = '<li>No scores yet</li>';
            } else {
                topScores.forEach((score, index) => {
                    const li = document.createElement('li');
                    li.textContent = `${index + 1}. Score: ${score.score.toLocaleString()}, Lines: ${score.lines}`;
                    leaderboardList.appendChild(li);
                });
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadLeaderboard();
        });
    </script>
    <script src="sologame.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  const currentUser = JSON.parse(localStorage.getItem('tetrixCurrentUser'));
  if (!currentUser) {
    window.location.href = 'login.html';
  }
});
</script>
</body>
</html>
